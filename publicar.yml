
name: Publicar artículo en Aprende
description: Crea una nueva publicación para GeoTrainer
title: "[PUBLICAR] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Formulario exclusivo para publicar artículos educativos."

  - type: input
    id: titulo
    attributes:
      label: Título
      placeholder: La caída del Imperio romano
    validations:
      required: true

  - type: dropdown
    id: categoria
    attributes:
      label: Categoría
      options:
        - Historia
        - Geografía
        - Cultura
        - Curiosidades
    validations:
      required: true

  - type: dropdown
    id: icono
    attributes:
      label: Icono
      options:
        - "📜"
        - "🌍"
        - "🏛️"
        - "💡"
        - "📖"

  - type: input
    id: fecha
    attributes:
      label: Fecha de publicación (AAAA-MM-DD)
      placeholder: "2026-11-01"
    validations:
      required: true

  - type: textarea
    id: contenido
    attributes:
      label: Explicación
      description: Separa los párrafos con líneas en blanco.
    validations:
      required: true

  - type: input
    id: imagen
    attributes:
      label: URL de imagen (opcional)
      placeholder: https://...

  - type: textarea
    id: preguntas
    attributes:
      label: Preguntas (opcional)
      description: "Una pregunta por línea. Formato: Enunciado | A | B | C | D | número correcto del 1 al 4 | Explicación"
