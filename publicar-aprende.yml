name: Publicar en Aprende
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  publicar:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[PUBLICAR]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Crear publicación
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/publicar_aprende.py
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publicaciones.json
          git diff --cached --quiet || (git commit -m "Publicación Aprende #${{ github.event.issue.number }}" && git push)
